[supervisord]
nodaemon=true
logfile=/dev/stdout
# This is to skip log rotation
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

[program:ollama]
command=ollama serve
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
# This is to skip log rotation
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
priority=1
startsecs=5

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
# This is to skip log rotation
stderr_logfile_maxbytes=0
stdout_logfile_maxbytes=0
priority=2
startsecs=10