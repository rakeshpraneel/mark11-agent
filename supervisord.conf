[supervisord]
nodaemon=true
logfile=syslog
pidfile=/var/run/supervisord.pid
user=root

[program:ollama]
command=ollama serve
autostart=true
autorestart=true
stderr_logfile=syslog
stdout_logfile=syslog
priority=1
startsecs=5

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=syslog
stdout_logfile=syslog
priority=2
startsecs=10